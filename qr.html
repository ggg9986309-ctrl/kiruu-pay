
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100c20">
<title>KIRUU PAY - QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100c20;color:white;font-family:Arial;padding:22px}
header{display:flex;align-items:center;gap:15px;margin:15px 0 35px}
button{cursor:pointer}
.back{background:#29203d;color:white;border:1px solid #49366b;padding:12px 18px;border-radius:12px}
.logo{font-weight:900;font-size:22px}
.logo span{color:#a78bfa}
h1{font-size:27px}
.sub{color:#aaa;font-size:14px;line-height:1.6}
.scanner{margin-top:25px;background:#211832;border:1px solid #49366b;border-radius:23px;padding:18px}
#reader{width:100%;overflow:hidden;border-radius:15px}
#reader video{border-radius:15px}
#reader img{max-width:100%}
#reader button{background:#7541d5;color:white;border:0;padding:10px;border-radius:10px}
#reader select{background:#100c20;color:white;padding:8px;border-radius:8px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.action{padding:17px 8px;border-radius:14px;background:#29203d;color:white;border:1px solid #49366b;font-weight:bold}
.result{display:none;margin-top:22px;padding:20px;background:#211832;border:1px solid #49366b;border-radius:18px;overflow-wrap:anywhere}
.primary{width:100%;margin-top:18px;padding:16px;background:linear-gradient(100deg,#8648ee,#5927bd);border:0;border-radius:13px;color:white;font-weight:bold}
.note{font-size:11px;color:#999;text-align:center;margin-top:25px;line-height:1.6}
</style>
</head>
<body>

<header>
<button class="back" onclick="location.href='index.html'">← Back</button>
<div class="logo">KIRUU <span>PAY</span></div>
</header>

<h1>Scan any QR code</h1>
<p class="sub">Place the QR code inside the camera frame to read its details.</p>

<div class="scanner">
 <div id="reader"></div>
</div>

<div class="actions">
 <button class="action" onclick="startCamera()">📷 Start Camera</button>
 <button class="action" onclick="document.getElementById('qrfile').click()">🖼️ Gallery Upload</button>
</div>

<input id="qrfile" type="file" accept="image/*" hidden>

<div class="result" id="result">
 <h3>QR Details Found ✓</h3>
 <p id="qrtext"></p>
 <button class="primary" onclick="demoPayment()">Continue to Demo Payment</button>
</div>

<p class="note">
KIRUU PAY DEMO SCANNER<br>
No money will be transferred. Never share your UPI PIN or OTP.
</p>

<script>
let scanner;
let currentQR="";

function showResult(value){
 currentQR=value;
 document.getElementById("qrtext").textContent=value;
 document.getElementById("result").style.display="block";
}

async function startCamera(){
 if(!window.Html5Qrcode){
  alert("Scanner library could not load. Check your internet.");
  return;
 }
 try{
  if(!scanner) scanner=new Html5Qrcode("reader");
  await scanner.start(
   {facingMode:"environment"},
   {fps:10,qrbox:{width:230,height:230}},
   text=>{
    scanner.stop().catch(()=>{});
    showResult(text);
   },
   ()=>{}
  );
 }catch(error){
  alert("Camera could not start. Allow camera permission and use HTTPS.");
 }
}

document.getElementById("qrfile").addEventListener("change",async e=>{
 const file=e.target.files[0];
 if(!file)return;
 try{
  if(!scanner)scanner=new Html5Qrcode("reader");
  const value=await scanner.scanFile(file,true);
  showResult(value);
 }catch(error){
  alert("QR code not found in this image.");
 }
 e.target.value="";
});

function demoPayment(){
 alert("Demo only! QR details were read, but no payment was made.");
}
</script>
</body>
</html>
