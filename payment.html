<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIRUU PAY - Payment</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 background:linear-gradient(145deg,#090613,#1b1035,#100b20);
 color:white;font-family:Arial,sans-serif;
 display:flex;justify-content:center;align-items:center;
 padding:20px
}
.container{
 width:100%;max-width:420px;
 background:#171126;border:1px solid #49336b;
 border-radius:25px;padding:25px;
 box-shadow:0 15px 50px #0008
}
.logo{text-align:center;color:#c7a4ff;font-size:25px;font-weight:bold}
.tag{text-align:center;color:#a99bbd;font-size:12px;margin:7px 0 25px}
.title{text-align:center;font-size:21px;margin-bottom:20px}
.recipient{
 background:#241a38;border-radius:16px;padding:18px;
 text-align:center;margin-bottom:22px
}
.avatar{
 width:55px;height:55px;border-radius:50%;
 background:linear-gradient(135deg,#a855f7,#5b21b6);
 display:grid;place-items:center;
 margin:auto auto 10px;font-size:23px;font-weight:bold
}
.name{font-size:18px;font-weight:bold}
.upi{font-size:12px;color:#b9a9cf;margin-top:6px;word-break:break-all}
label{display:block;color:#c9b8df;font-size:13px;margin-bottom:9px}
input{
 width:100%;padding:16px;border-radius:13px;
 border:1px solid #594477;background:#0e0a19;
 color:white;font-size:19px;outline:none
}
input:focus{border-color:#bb86fc}
button{
 width:100%;padding:16px;border:0;border-radius:13px;
 background:linear-gradient(90deg,#9333ea,#6d28d9);
 color:white;font-size:16px;font-weight:bold;
 margin-top:18px;cursor:pointer
}
.notice{
 margin-top:20px;padding:12px;border-radius:12px;
 background:#2b203c;color:#d8c9eb;
 font-size:11px;line-height:1.6;text-align:center
}
.status{display:none;text-align:center;margin-top:20px;color:#d8c9eb}
</style>
</head>

<body>
<div class="container">
 <div class="logo">👑 KIRUU PAY</div>
 <div class="tag">SMART • SIMPLE • SECURE</div>

 <div class="title">Payment Details</div>

 <div class="recipient">
  <div class="avatar" id="avatar">K</div>
  <div class="name" id="person">Unknown Recipient</div>
  <div class="upi" id="upi">UPI details unavailable</div>
 </div>

 <label>Enter Amount (₹)</label>
 <input id="amount" type="number" min="1" max="100000"
 placeholder="₹ 0.00">

 <button onclick="makePayment()">Continue</button>

 <div class="status" id="status"></div>

 <div class="notice">
  DEMO MODE ONLY<br>
  No money will be transferred. This screen does not make real UPI payments.
 </div>
</div>

<script>
const params=new URLSearchParams(location.search);
const raw=params.get("upi")||"";

let recipient="Unknown Recipient";
let upiId="UPI details unavailable";

try{
 const parsed=new URL(raw);
 if(parsed.protocol==="upi:"){
  recipient=parsed.searchParams.get("pn")||recipient;
  upiId=parsed.searchParams.get("pa")||upiId;
 }
}catch(e){}

document.getElementById("person").textContent=recipient;
document.getElementById("upi").textContent=upiId;
document.getElementById("avatar").textContent=
 recipient.charAt(0).toUpperCase();

function makePayment(){
 const amount=Number(document.getElementById("amount").value);
 const status=document.getElementById("status");

 if(!Number.isFinite(amount)||amount<1||amount>100000){
  alert("Please enter an amount between ₹1 and ₹1,00,000");
  return;
 }

 status.style.display="block";
 status.innerHTML=
 "DEMO PAYMENT PREVIEW<br><br>"+
 "Recipient: "+escapeText(recipient)+"<br>"+
 "UPI ID: "+escapeText(upiId)+"<br>"+
 "Amount: ₹"+amount.toFixed(2)+
 "<br><br>No payment has been made.";
}

function escapeText(value){
 return String(value).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
 });
}
</script>
</body>
</html>
